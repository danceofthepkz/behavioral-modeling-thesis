about: >
  Do conclusions survive the correction-trial policy and session-reset assumptions?
task: fit
models: core
datasets: [paper19]
overrides:
  collect.contrasts: [[S+R, S+C], [A+R, A+C]]
  collect.groups: paper_clusters
grid:
  preprocess.correction: [mask, include]
  model.session_reset:
    - [wsls]
    - [wsls, choice]
    - [wsls, stimulus, action, choice]
