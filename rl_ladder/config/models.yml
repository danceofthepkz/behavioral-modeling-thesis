# A model selects a value-learning base and independent history modules.
# stimulus: none | S | S_cf | A | B; B includes the original gamma coupling.
# action: none | V | wsls; choice: none | ck; feedback: none | cf.
# F is filtered choice x feedback; C remains the reward-independent choice kernel.
# `fixed: {param: value}` pins a parameter; `free: [param]` frees an extra one.

models:
  M1:      {stimulus: none, about: "random responding with bias"}
  M2:      {action: wsls, fixed: {b: 0.0}, about: "noisy win-stay/lose-shift"}
  S0:      {stimulus: S, about: "stimulus-specific RL"}
  S+R:     {stimulus: S, action: V, about: "S0 + reward-dependent action value V"}
  S+C:     {stimulus: S, choice: ck, about: "S0 + choice kernel"}
  S+R+C:   {stimulus: S, action: V, choice: ck, about: "S0 + action value V + choice kernel"}
  A0:      {stimulus: A, about: "Collina simple model (3 parameters)"}
  A+C:     {stimulus: A, choice: ck, about: "A0 + choice kernel"}
  B0:      {stimulus: B, about: "Collina choice-history model; formerly A+R"}
  B+C:     {stimulus: B, choice: ck, about: "B0 + choice kernel; formerly A+R+C"}
  S+F:     {stimulus: S, feedback: cf, about: "S0 + choice-feedback history"}
  S+F+C:   {stimulus: S, feedback: cf, choice: ck, about: "S0 + choice-feedback history + choice kernel"}
  A+F:     {stimulus: A, feedback: cf, about: "A0 + choice-feedback history"}
  A+F+C:   {stimulus: A, feedback: cf, choice: ck, about: "A0 + choice-feedback history + choice kernel"}
  B+F:     {stimulus: B, feedback: cf, about: "B0 + choice-feedback history"}
  B+F+C:   {stimulus: B, feedback: cf, choice: ck, about: "B0 + choice-feedback history + choice kernel"}

  # Combined R/F models complete the S-family comparisons.
  S+R+F:   {stimulus: S, action: V, feedback: cf, about: "S0 + action value V + choice-feedback history"}
  S+R+F+C: {stimulus: S, action: V, feedback: cf, choice: ck, about: "S0 + V + F + C"}
  S0cf:    {stimulus: S_cf, about: "S0 + counterfactual update of the unchosen action"}
  A0T:     {stimulus: A, free: [tau_a], about: "A0 with free inverse temperature"}
  V:       {action: V, about: "stimulus-blind action value"}
  C:       {choice: ck, about: "choice kernel only"}
  V+C:     {action: V, choice: ck, about: "stimulus-blind action value + choice kernel"}
  F:       {feedback: cf, about: "choice-feedback history only"}
  F+C:     {feedback: cf, choice: ck, about: "PR decision rule (bias + F + C); no current stimulus"}

  # A fixed temperature is a sensitivity setting, not proof of identifiability.
  S0f:     {stimulus: S, fixed: {beta_q: 5.0}, about: "S0, beta_q fixed at 5"}
  S+Rf:    {stimulus: S, action: V, fixed: {beta_q: 5.0}, about: "S+R, beta_q fixed at 5"}
  S+Cf:    {stimulus: S, choice: ck, fixed: {beta_q: 5.0}, about: "S+C, beta_q fixed at 5"}
  S+R+Cf:  {stimulus: S, action: V, choice: ck, fixed: {beta_q: 5.0}, about: "S+R+C, beta_q fixed at 5"}
  S+Ff:    {stimulus: S, feedback: cf, fixed: {beta_q: 5.0}, about: "S+F, beta_q fixed at 5"}
  S+F+Cf:  {stimulus: S, feedback: cf, choice: ck, fixed: {beta_q: 5.0}, about: "S+F+C, beta_q fixed at 5"}
  S+R+Ff:  {stimulus: S, action: V, feedback: cf, fixed: {beta_q: 5.0}, about: "S+R+F, beta_q fixed at 5"}
  S+R+F+Cf: {stimulus: S, action: V, feedback: cf, choice: ck, fixed: {beta_q: 5.0}, about: "S+R+F+C, beta_q fixed at 5"}

sets:
  core: [M1, M2, S0, S+R, S+C, S+R+C, A0, B0, A+C, B+C, S+F, S+F+C, A+F, A+F+C, B+F, B+F+C, S+R+F, S+R+F+C]
  core_original: [M1, M2, S0, S+R, S+C, S+R+C, A0, B0, A+C, B+C]
  feedback: [S0, S+C, S+F, S+F+C, A0, A+C, A+F, A+F+C, B0, B+C, B+F, B+F+C]
  feedback_fixed: [S0f, S+Cf, S+Ff, S+F+Cf, A0, A+C, A+F, A+F+C, B0, B+C, B+F, B+F+C]
  paper: [A0, B0]
  baselines: [M1, M2]
  S: [S0, S+R, S+C, S+R+C, S+F, S+F+C, S+R+F, S+R+F+C]
  S_extended: [S0, S+R, S+C, S+R+C, S+F, S+F+C, S+R+F, S+R+F+C]
  reward_extension: [S+R, S+R+C, S+R+F, S+R+F+C]
  A: [A0, A+C, A+F, A+F+C]
  B: [B0, B+C, B+F, B+F+C]
  blind: [M1, V, C, V+C, F, F+C]
  S_fixed: [S0f, S+Rf, S+Cf, S+R+Cf, S+Ff, S+F+Cf, S+R+Ff, S+R+F+Cf]
